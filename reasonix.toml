allow = ["Bash=php -r '\nrequire_once \"html/ctc/app/Bootstrap.php\";\n$app = new \\App\\Bootstrap();\n$app->runConsole();\n$vodService = new \\App\\Services\\Vod();\n$info = $vodService->getPlayInfo(\"v02147g10074dafninq7dld2li96hr30\");\necho json_encode($info, JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);\n'", "Bash=python3 -c '\nimport os\n\nroot_dir = \"html\"\ntarget_str = \"深圳市酷瓜软件有限公司\"\nmatches = []\n\nfor root, dirs, files in os.walk(root_dir):\n    if \".git\" in dirs:\n        dirs.remove(\".git\")\n    for file in files:\n        filepath = os.path.join(root, file)\n        try:\n            with open(filepath, \"r\", encoding=\"utf-8\", errors=\"ignore\") as f:\n                content = f.read()\n                if target_str in content:\n                    matches.append(filepath)\n        except Exception as e:\n            pass\n\nprint(f\"Total matching files: {len(matches)}\")\nfor m in matches[:10]:\n    print(m)\nif len(matches) > 10:\n    print(\"...\")\n'", "Bash=tail -n 60 html/ctc/storage/log/http-$(date +%Y-%m-%d).log 2>/dev/null || tail -n 60 html/ctc/storage/log/*.log", "Bash=curl -s \"https://clawhub.ai/api/v1/skills/volcengine-ai-mediakit\" | python3 -c 'import sys, json; data=json.load(sys.stdin); print(list(data.keys())); print(list(data.get(\"latestVersion\", {}).keys()))'", "Bash=python3 -c '\nimport urllib.request, json\nreq = urllib.request.Request(\"https://clawhub.ai/api/v1/skills/volcengine-ai-mediakit\")\nwith urllib.request.urlopen(req) as resp:\n    data = json.loads(resp.read().decode(\"utf-8\"))\nprint(json.dumps(data, indent=2, ensure_ascii=False)[:1000])\n'"]
