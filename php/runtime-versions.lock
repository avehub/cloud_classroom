# PHP 运行时基线（reload-prod.sh 每次发布后自动与容器内实际版本比对）
#
# 更新方式：确认新版本可用后，把最后这行数据替换为脚本打印的实际值并提交。
#
# 版本锁定现状（见 php/Dockerfile）：
#   FROM php:8.2.35-fpm-bookworm
#   pecl install psr-1.2.0 redis-6.3.0 igbinary-3.2.16 phalcon-5.23.0
#   COPY --from=composer:2.10.3
#   apt 包与 Debian 基础层仍随 tag 浮动（钉 apt 精确版本会因镜像源轮转而构建失败，故不钉）
#
# 变更记录：
#   2026-11-12  igbinary 3.2.17RC1 -> 3.2.16（钉版本时从 RC 回到稳定版）。
#               已实测向后兼容：旧扩展写入 Redis 的 igbinary 数据（中文/嵌套结构、
#               App\Caches\Course 业务缓存、Phalcon Redis 模型元数据）能被 3.2.16
#               完整读出且 payload md5 一致，因此切换镜像无需清空 Redis。
#   2026-11-12  镜像改为异地构建交付（Apple Silicon + Rosetta 构建 amd64，实测 9.3 分钟），
#               生产不再执行 pecl 编译。
php=8.2.35 phalcon=5.23.0 redis=6.3.0 igbinary=3.2.16 psr=1.2.0
