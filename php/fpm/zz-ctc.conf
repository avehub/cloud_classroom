; CTC PHP-FPM pool hardening
; 保守值：2C8G 宿主机，php 容器 2GB 限制，memory_limit=256M
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/slow.log
